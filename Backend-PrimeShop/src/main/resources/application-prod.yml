spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db.zrwfwdjmqztbbgtfhinf.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Hibernate tự động tạo bảng trên Supabase Postgres
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Tắt Flyway ở môi trường prod
  flyway:
    enabled: false

server:
  port: ${PORT:8080}
  ssl:
    enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true